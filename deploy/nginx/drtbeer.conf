# Darth Beer.com 公開用 vhost (2026-09-02)
# TLS は ALB で終端し、ここには HTTP で届く。プロトコルは X-Forwarded-Proto で判別する。
#
# 既存の beer.conf (beer.local / dev.beer.local) は内部確認用としてそのまま残す。
# こちらは公開ドメイン用。

# --- www は apex へ寄せる (正規URLを1本にする) ---
server {
    listen 80;
    server_name www.drtbeer.com;
    return 301 https://drtbeer.com$request_uri;
}

# --- 本番 ---
server {
    listen 80;
    server_name drtbeer.com;

    client_max_body_size 20m;

    # サイトマップは PHP で動的生成している (公開ドメインが未定の時期に作ったため、
    # リクエストのホスト名から絶対URLを組み立てる)。しかし **Search Console は
    # 拡張子が .php のパスを受け付けない**("有効なパスを入力してください" で弾かれる)。
    # Apache 側は AllowOverride None で .htaccess が使えないため、ここで振り向ける。
    location = /sitemap.xml {
        proxy_pass http://beer-prod:80/sitemap.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://beer-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# --- dev (Basic認証) ---
server {
    listen 80;
    server_name dev.drtbeer.com;

    auth_basic "beer dev";
    auth_basic_user_file /etc/nginx/htpasswd-dev;

    client_max_body_size 20m;

    # 検索エンジンに拾わせない。dev は本番と同じ内容を返すので、
    # 索引されると重複コンテンツになる。
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /sitemap.xml {
        proxy_pass http://beer-dev:80/sitemap.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://beer-dev:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
