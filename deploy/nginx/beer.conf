# beer の vhost — サーバの /srv/seisan3/deploy/nginx/conf.d/ に配置する
# BEER_DOMAIN はドメイン確定後に置換する (例: darthbeer.com)
# default_server は seisan3.conf 側 (seisan3-prod) のまま変えないこと (ALBヘルスチェック)

server {
    listen 80;
    server_name BEER_DOMAIN;

    client_max_body_size 20m;

    location / {
        proxy_pass http://beer-prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 80;
    server_name dev.BEER_DOMAIN;

    auth_basic "beer dev";
    auth_basic_user_file /etc/nginx/htpasswd-dev;

    client_max_body_size 20m;

    location / {
        proxy_pass http://beer-dev:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
